<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JobBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 860px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .brand h1 { font-size: 24px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
    .brand p  { font-size: 13px; color: #888; margin-top: 3px; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 8px 14px;
      flex: 1;
      max-width: 340px;
    }

    .search-bar i { color: #aaa; font-size: 16px; }
    .search-bar input { border: none; background: transparent; outline: none; font-size: 14px; color: #1a1a1a; width: 100%; }
    .search-bar input::placeholder { color: #bbb; }

    .filter-section { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 1.25rem; }

    .filter-group label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }

    .filter-group .pills { display: flex; gap: 6px; flex-wrap: wrap; }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { background: #f0f0f0; color: #555; }
    .filter-btn.active { background: #185FA5; border-color: #185FA5; color: #fff; }

    .result-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .result-bar p { font-size: 13px; color: #aaa; }
    .clear-btn { font-size: 12px; color: #aaa; background: none; border: none; cursor: pointer; text-decoration: underline; }
    .clear-btn:hover { color: #555; }

    .job-list { display: flex; flex-direction: column; gap: 10px; }

    .job-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 14px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .job-card:hover { border-color: #ccc; transform: translateX(3px); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .job-card.selected { border-color: #185FA5; border-width: 1.5px; }

    .company-logo {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      flex-shrink: 0;
      color: #444;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 3px;
    }

    .job-title   { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .job-salary  { font-size: 14px; font-weight: 600; color: #1a1a1a; white-space: nowrap; }
    .job-company { font-size: 13px; color: #888; margin-bottom: 10px; }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    .tag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 10px;
      border: 1px solid #e8e8e8;
      color: #888;
      background: #f8f8f8;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .tag i { font-size: 11px; }
    .tag-blue  { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }
    .tag-green { background: #EAF3DE; color: #3B6D11; border-color: #C0DD97; }
    .tag-amber { background: #FAEEDA; color: #854F0B; border-color: #FAC775; }

    .chevron { font-size: 16px; color: #ccc; flex-shrink: 0; margin-top: 4px; }

    .no-results { display: none; text-align: center; padding: 4rem 0; color: #bbb; font-size: 14px; }
    .no-results i { font-size: 40px; display: block; margin-bottom: 10px; }

    .detail-panel {
      display: none;
      margin-top: 1.25rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 1.5rem;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-inner { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }

    .detail-logo {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      flex-shrink: 0;
      color: #444;
    }

    .detail-info  { flex: 1; min-width: 200px; }
    .detail-title { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; }
    .detail-sub   { font-size: 14px; color: #888; margin-bottom: 12px; }
    .detail-tags  { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

    .salary-tag {
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
      padding: 3px 10px;
      background: #f5f5f5;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }

    .detail-desc    { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 16px; }
    .detail-actions { display: flex; gap: 8px; }

    .btn-apply {
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: #185FA5;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-apply:hover { background: #1a6db8; }

    .btn-close {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-close:hover { background: #f5f5f5; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="brand">
      <h1><i class="ti ti-briefcase"></i> JobBoard</h1>
      <p>Find your dream role</p>
    </div>
    <div class="search-bar">
      <i class="ti ti-search"></i>
      <input id="searchInput" type="text" placeholder="Search jobs or companies..." />
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-group">
      <label>Role</label>
      <div class="pills" id="roleFilters"></div>
    </div>
    <div class="filter-group">
      <label>Location</label>
      <div class="pills" id="locationFilters"></div>
    </div>
  </div>

  <div class="result-bar">
    <p id="resultCount"></p>
    <button class="clear-btn" onclick="clearFilters()">Clear filters</button>
  </div>

  <div class="job-list" id="jobList"></div>

  <div class="no-results" id="noResults">
    <i class="ti ti-mood-sad"></i>
    No jobs match your filters. Try adjusting your search.
  </div>

  <div class="detail-panel" id="detailPanel"></div>

</div>

<script>
  const jobs = [
    { id:1,  title:"Frontend Developer",    company:"Zomato",   location:"Hyderabad", role:"Engineering", type:"Full-time", salary:"₹8–12 LPA",  logo:"Z", bg:"#FAEEDA", desc:"Build and maintain responsive UIs using React and TypeScript. Work closely with designers to implement pixel-perfect interfaces and improve web performance." },
    { id:2,  title:"UI/UX Designer",         company:"Swiggy",   location:"Bangalore", role:"Design",      type:"Full-time", salary:"₹7–10 LPA",  logo:"S", bg:"#FBEAF0", desc:"Design intuitive user experiences for our food delivery platform. Create wireframes, prototypes, and high-fidelity mockups using Figma." },
    { id:3,  title:"Backend Engineer",       company:"Infosys",  location:"Pune",      role:"Engineering", type:"Full-time", salary:"₹6–9 LPA",   logo:"I", bg:"#E6F1FB", desc:"Design and develop scalable REST APIs using Node.js and PostgreSQL. Collaborate with front-end teams to integrate services efficiently." },
    { id:4,  title:"Product Manager",        company:"Flipkart", location:"Bangalore", role:"Product",     type:"Full-time", salary:"₹15–22 LPA", logo:"F", bg:"#EAF3DE", desc:"Define product vision and roadmap for the checkout experience. Work cross-functionally with engineering, design, and data teams to ship features." },
    { id:5,  title:"React Native Developer", company:"Meesho",   location:"Remote",    role:"Engineering", type:"Full-time", salary:"₹9–14 LPA",  logo:"M", bg:"#EEEDFE", desc:"Build cross-platform mobile apps using React Native. Optimize performance and ensure a great user experience across Android and iOS devices." },
    { id:6,  title:"UX Researcher",          company:"Google",   location:"Hyderabad", role:"Design",      type:"Contract",  salary:"₹12–18 LPA", logo:"G", bg:"#E1F5EE", desc:"Conduct user research, usability studies, and interviews to inform product decisions. Present insights and recommendations to stakeholders." },
    { id:7,  title:"Data Analyst",           company:"Amazon",   location:"Chennai",   role:"Data",        type:"Full-time", salary:"₹10–16 LPA", logo:"A", bg:"#FAEEDA", desc:"Analyze large datasets to extract actionable business insights. Create dashboards and reports using SQL, Python, and Tableau." },
    { id:8,  title:"DevOps Engineer",        company:"TCS",      location:"Mumbai",    role:"Engineering", type:"Full-time", salary:"₹8–13 LPA",  logo:"T", bg:"#F1EFE8", desc:"Manage CI/CD pipelines, cloud infrastructure, and deployment automation using AWS, Docker, and Kubernetes." },
    { id:9,  title:"Graphic Designer",       company:"Canva",    location:"Remote",    role:"Design",      type:"Part-time", salary:"₹4–6 LPA",   logo:"C", bg:"#FBEAF0", desc:"Create visual assets for social media, marketing campaigns, and product UI. A strong portfolio in brand and digital design is required." },
    { id:10, title:"ML Engineer",            company:"Wipro",    location:"Pune",      role:"Data",        type:"Full-time", salary:"₹11–17 LPA", logo:"W", bg:"#E6F1FB", desc:"Build and deploy machine learning models for predictive analytics pipelines. Experience with PyTorch and model serving frameworks required." },
    { id:11, title:"Full Stack Developer",   company:"Razorpay", location:"Bangalore", role:"Engineering", type:"Full-time", salary:"₹12–18 LPA", logo:"R", bg:"#EAF3DE", desc:"Develop end-to-end features on our payments platform using React and Go. Own features from design to deployment with high code quality." },
    { id:12, title:"Product Designer",       company:"CRED",     location:"Bangalore", role:"Design",      type:"Full-time", salary:"₹10–15 LPA", logo:"C", bg:"#EEEDFE", desc:"Craft delightful product experiences for our premium fintech app. Deep focus on visual design, motion, and interaction quality." },
  ];

  const roles     = ["All", ...new Set(jobs.map(j => j.role))];
  const locations = ["All", ...new Set(jobs.map(j => j.location))];
  let activeRole = "All", activeLoc = "All", selectedId = null;

  const roleEl   = document.getElementById("roleFilters");
  const locEl    = document.getElementById("locationFilters");
  const listEl   = document.getElementById("jobList");
  const noResEl  = document.getElementById("noResults");
  const detailEl = document.getElementById("detailPanel");
  const searchEl = document.getElementById("searchInput");
  const countEl  = document.getElementById("resultCount");

  function renderFilters() {
    roleEl.innerHTML = roles.map(r =>
      `<button class="filter-btn ${r === activeRole ? 'active' : ''}" onclick="setRole('${r}')">${r}</button>`
    ).join("");
    locEl.innerHTML = locations.map(l =>
      `<button class="filter-btn ${l === activeLoc ? 'active' : ''}" onclick="setLoc('${l}')">${l}</button>`
    ).join("");
  }

  function setRole(r) { activeRole = r; reset(); }
  function setLoc(l)  { activeLoc  = l; reset(); }

  function clearFilters() {
    activeRole = "All"; activeLoc = "All";
    searchEl.value = "";
    reset();
  }

  function reset() {
    selectedId = null;
    detailEl.style.display = "none";
    renderFilters();
    renderList();
  }

  function getFiltered() {
    const q = searchEl.value.toLowerCase();
    return jobs.filter(j =>
      (activeRole === "All" || j.role === activeRole) &&
      (activeLoc  === "All" || j.location === activeLoc) &&
      (j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q))
    );
  }

  function typeTag(t) {
    if (t === "Full-time") return `<span class="tag tag-green">${t}</span>`;
    if (t === "Contract")  return `<span class="tag tag-amber">${t}</span>`;
    return `<span class="tag">${t}</span>`;
  }

  function renderList() {
    const filtered = getFiltered();
    countEl.textContent = `${filtered.length} job${filtered.length !== 1 ? 's' : ''} found`;
    if (!filtered.length) {
      listEl.innerHTML = "";
      noResEl.style.display = "block";
      return;
    }
    noResEl.style.display = "none";
    listEl.innerHTML = filtered.map(j => `
      <div class="job-card ${selectedId === j.id ? 'selected' : ''}" onclick="selectJob(${j.id})">
        <div class="company-logo" style="background:${j.bg};">${j.logo}</div>
        <div class="card-body">
          <div class="card-top">
            <span class="job-title">${j.title}</span>
            <span class="job-salary">${j.salary}</span>
          </div>
          <p class="job-company">${j.company}</p>
          <div class="tags">
            <span class="tag tag-blue"><i class="ti ti-map-pin"></i>${j.location}</span>
            <span class="tag"><i class="ti ti-tag"></i>${j.role}</span>
            ${typeTag(j.type)}
          </div>
        </div>
        <i class="ti ti-chevron-right chevron"></i>
      </div>
    `).join("");
  }

  function selectJob(id) {
    selectedId = id;
    const j = jobs.find(x => x.id === id);
    detailEl.style.display = "block";
    detailEl.innerHTML = `
      <div class="detail-inner">
        <div class="detail-logo" style="background:${j.bg};">${j.logo}</div>
        <div class="detail-info">
          <p class="detail-title">${j.title}</p>
          <p class="detail-sub">${j.company} &middot; ${j.location}</p>
          <div class="detail-tags">
            <span class="tag tag-blue"><i class="ti ti-map-pin"></i>${j.location}</span>
            <span class="tag"><i class="ti ti-tag"></i>${j.role}</span>
            ${typeTag(j.type)}
            <span class="salary-tag">${j.salary}</span>
          </div>
          <p class="detail-desc">${j.desc}</p>
          <div class="detail-actions">
            <button class="btn-apply">Apply now</button>
            <button class="btn-close" onclick="closeDetail()">Close</button>
          </div>
        </div>
      </div>
    `;
    renderList();
    detailEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function closeDetail() {
    detailEl.style.display = "none";
    selectedId = null;
    renderList();
  }

  searchEl.addEventListener("input", () => {
    selectedId = null;
    detailEl.style.display = "none";
    renderList();
  });

  renderFilters();
  renderList();
</script>
</body>
</html>
